name: IISS2026

# Corre en master, en las ramas de cada iteración (implementacion*), en los tags de entrega
# (version*) y en los PR hacia esas ramas.
on:
  push:
    branches: [ "master", "implementacion*" ]
    tags: [ "version*" ]
  pull_request:
    branches: [ "master", "implementacion*" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # Un solo paso que verifica todo: formato (Spotless), compilación, tests unitarios y de
      # integración, umbral de cobertura del core (JaCoCo check) y empaquetado. Si algo no
      # cumple, la corrida falla.
      - name: Verificar (mvn verify)
        run: mvn -B verify

      # Los reportes se suben aunque la verificación falle, para poder ver qué falló.
      - name: Subir reporte de cobertura del core
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-core-jacoco
          path: modules/core/target/site/jacoco/
          if-no-files-found: ignore

      - name: Subir reportes de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-tests
          path: modules/*/target/surefire-reports/
          if-no-files-found: ignore
