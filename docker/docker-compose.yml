services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto-broker
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

  subscriber:
    build:
      context: ..                       # Apunta a la raíz del proyecto (donde está el pom.xml y src)
      dockerfile: src/subscriber/Dockerfile     # Ruta al Dockerfile relativa al contexto
    container_name: java-subscriber
    depends_on:
      - mosquitto
    restart: unless-stopped

  eventgenerator:
    build:
      context: ..
      dockerfile: src/eventGenerator/Dockerfile
    container_name: event-generator
    depends_on:
      - mosquitto
    restart: unless-stopped


