services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto-broker
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

  eventgenerator:
    build:
      context: ..
      dockerfile: modules/eventGenerator/Dockerfile
    container_name: event-generator
    depends_on:
      - mosquitto
    restart: unless-stopped

  engine:
    build:
      context: ..
      dockerfile: modules/engine/Dockerfile
    container_name: java-engine
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/iiss2026
      - DB_USER=root
      - DB_PASSWORD=root
      - MQTT_BROKER=tcp://mosquitto:1883
      - SWITCH_STUB_URL=http://switch-stub:8081
      - API_KEY=ecowarm-grupo4-2026
      # Log a archivo (ademas de la consola): lo lee scripts/receive-temp.sh
      - LOGGING_FILE_NAME=logs/engine.log
    volumes:
      - ../logs:/app/logs
    depends_on:
      - postgres
      - mosquitto
      - switch-stub
    restart: unless-stopped

  switch-stub:
    build:
      context: ..
      dockerfile: modules/switch-stub/Dockerfile
    container_name: switch-stub
    ports:
      - "8081:8081"
    volumes:
      - ../logs:/app/logs
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      - POSTGRES_DB=iiss2026
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:


