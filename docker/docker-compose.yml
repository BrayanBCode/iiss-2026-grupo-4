# EcoWarm — controlador de calefacción (grupo 4), Iteración 4.
#
# Levanta SOLO el controlador ("engine"). El entorno —broker MQTT, termostatos,
# switches e inventario— lo pone el simulador de la cátedra o el ecowarm-check,
# corriendo en la máquina anfitriona y publicado en el puerto 9090.
#
#   ./scripts/up.sh
#   java -jar ecowarm-check.jar --anunciar host.docker.internal
#
# El controlador se registra solo ante el entorno (§6), recibe de ahí el broker
# MQTT, y queda esperando el PUT /sitio y el INICIAR. Para integrarse con el
# simulador en su red Docker (iiss-lab-net) ver docker-compose.lab.yml.
services:
  engine:
    build:
      context: ..
      dockerfile: modules/engine/Dockerfile
    container_name: ecowarm-grupo4
    ports:
      - "8080:8080"
    environment:
      # Clave que EXIGE este controlador y que declara al registrarse (no puede ir vacía).
      - API_KEY=${API_KEY:-ecowarm-grupo4-2026}
      # Dónde está el entorno, y la clave que él exige (vacía = el checker sin --clave).
      - ENTORNO_URL=${ENTORNO_URL:-http://host.docker.internal:9090}
      - ENTORNO_API_KEY=${ENTORNO_API_KEY:-}
      # Dónde alcanza el ENTORNO a este controlador: el puerto publicado en el anfitrión.
      - CONTROLADOR_BASE_URL=${CONTROLADOR_BASE_URL:-http://localhost:8080}
      - CONTROLADOR_ETIQUETA=${CONTROLADOR_ETIQUETA:-ecowarm-grupo4}
      # Zona para la franja tarifaria. Vacía = la de la fechaHora de INICIAR.
      - CONTROL_ZONA_HORARIA=${CONTROL_ZONA_HORARIA:-}
      - LOGGING_FILE_NAME=logs/engine.log
    extra_hosts:
      # En Linux host.docker.internal no existe por defecto.
      - "host.docker.internal:host-gateway"
    volumes:
      - inventario:/app/data
      - ../logs:/app/logs
    restart: unless-stopped

volumes:
  inventario:
