server.port=8080

# --- Credenciales (estandar v2, convenciones transversales) -----------------
# Clave que este controlador EXIGE en X-API-Key y que declara al registrarse (§6).
# No puede ir vacia. El valor real viene de la variable de entorno API_KEY.
api.security.api-key=${API_KEY:changeme-dev-key}
# Clave que el ENTORNO (simulador / ecowarm-check) exige en su X-API-Key. Vacia = no se envia.
entorno.api-key=${ENTORNO_API_KEY:}
# Clave que exigen los SWITCHES (§3/§4). Por defecto la misma del entorno (el simulador es el switch).
switch.api-key=${SWITCH_API_KEY:${ENTORNO_API_KEY:}}

# --- Registro ante el entorno (§6) -------------------------------------------
# Vacio = instalacion real sin registro: se usa mqtt.broker.url.
entorno.url=${ENTORNO_URL:}
controlador.etiqueta=${CONTROLADOR_ETIQUETA:ecowarm-grupo4}
# Donde el ENTORNO alcanza a este controlador (desde su red, no desde la nuestra).
controlador.base-url=${CONTROLADOR_BASE_URL:http://localhost:8080}
# Broker si el entorno no lo informa (o no hay entorno).
mqtt.broker.url=${MQTT_BROKER:tcp://localhost:1883}
# Espera maxima entre reintentos de reconexion si el broker se cae (Paho la duplica hasta este tope).
mqtt.reconexion-max-segundos=${MQTT_RECONEXION_MAX_SEGUNDOS:5}

# --- Persistencia del inventario (§5.1) --------------------------------------
inventario.archivo=${INVENTARIO_ARCHIVO:./data/inventario.json}

# --- Control ------------------------------------------------------------------
# Zona en la que se lee la franja tarifaria. Vacia = la de la fechaHora de INICIAR.
control.zona-horaria=${CONTROL_ZONA_HORARIA:}
control.tick-ms=${CONTROL_TICK_MS:1000}
control.reconciliacion-segundos=${CONTROL_RECONCILIACION_SEGUNDOS:15}
control.histeresis-c=${CONTROL_HISTERESIS_C:0.3}
control.margen-intercambio-c=${CONTROL_MARGEN_INTERCAMBIO_C:0.5}
control.vigencia-lectura-segundos=${CONTROL_VIGENCIA_LECTURA_SEGUNDOS:600}

# --- Switches -------------------------------------------------------------------
switch.timeout-conexion-ms=2000
switch.timeout-lectura-ms=3000
switch.espera-reintento-segundos=5
