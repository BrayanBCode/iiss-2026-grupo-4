server.port=8080

# Conexion a la base: variables de entorno DB_URL, DB_USER, DB_PASSWORD
# (definidas en docker-compose.yml).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# El esquema (habitaciones y lecturas) lo gestiona Flyway con los scripts de
# db/migration; Hibernate NO debe tocarlo: solo lee/escribe filas.
# baseline-on-migrate: una base creada antes por el subscriber (sin historial de
# Flyway) se toma como version 1 en vez de fallar; una base vacia migra normal.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=none

# Direccionamiento del "sitio": de donde el engine lee las lecturas
# (broker MQTT, ver LecturaMqttListener) y contra
# donde acciona los switches (stub REST). idTermostato e idSwitch en el
# recurso habitacion son solo identificadores; esta es la config concreta.
mqtt.broker.url=${MQTT_BROKER:tcp://mosquitto:1883}
switch.stub.url=${SWITCH_STUB_URL:http://switch-stub:8081}

# Esquema de autenticacion pedido por la letra (API key por header, ver
# ApiKeyFilter y el securityScheme "ApiKeyAuth" de docs/api/openapi.yaml).
# El valor real SIEMPRE debe venir de la variable de entorno API_KEY en
# docker-compose.yml; el default de aca es solo para levantar el api local
# sin Docker (ej. desde el IDE) y no debe usarse en ningun entorno real.
api.security.api-key=${API_KEY:changeme-dev-key}